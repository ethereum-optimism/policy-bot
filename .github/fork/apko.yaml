contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - ca-certificates-bundle
    - wolfi-baselayout
    - policy-bot@local

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

work-dir: /app

entrypoint:
  command: /usr/local/bin/policy-bot

cmd: server --config /secrets/policy-bot.yml

stop-signal: SIGINT

annotations:
  org.opencontainers.image.source: https://github.com/ethereum-optimism/policy-bot
  org.opencontainers.image.title: policy-bot
