name: Build images

on:
  push:
    branches:
      - oplabs
    tags:
      - 'policy-bot/v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-images:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ethereum-optimism/factory/.github/workflows/build-images.yaml@62f01c67214a022f19aa0a9cba3f8da94c707996
