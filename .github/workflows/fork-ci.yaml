name: Fork CI

on:
  push:
    branches:
      - oplabs
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: head

      - name: Checkout base
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          path: base

      - name: Check history against the upstream release
        working-directory: head
        env:
          UPSTREAM_REPOSITORY_URL: https://github.com/palantir/policy-bot
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          base_checker="${GITHUB_WORKSPACE}/base/.github/fork/check-history.sh"
          base_allowed="${GITHUB_WORKSPACE}/base/.github/fork/allowed-paths"
          if [ -f "$base_checker" ] && [ -f "$base_allowed" ]; then
            ALLOWED_PATHS_FILE="$base_allowed" bash "$base_checker"
            exit 0
          fi
          tag="$(tr -d '[:space:]' < .github/fork/upstream-tag)"
          upstream_sha="$(git ls-remote "$UPSTREAM_REPOSITORY_URL" "refs/tags/${tag}^{}" | cut -f1)"
          if [ -z "$upstream_sha" ]; then
            upstream_sha="$(git ls-remote "$UPSTREAM_REPOSITORY_URL" "refs/tags/${tag}" | cut -f1)"
          fi
          if [ -z "$upstream_sha" ] || [ "$upstream_sha" != "$BASE_SHA" ]; then
            echo "::error::the base has no checker and is not the upstream ${tag} commit" >&2
            exit 1
          fi
          echo "::warning::the base is the unmodified upstream ${tag}, so the checker from the head is used once"
          bash .github/fork/check-history.sh

  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false

      - name: Check vendored modules
        run: |
          go mod verify
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor
          test -z "$(git status --porcelain -- vendor)"

      - name: Run upstream verification
        run: ./godelw verify --apply=false

  fork-ci:
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs:
      - history
      - verify
    steps:
      - name: Check required job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed: ${RESULTS}" >&2
              exit 1
            fi
          done
